# schema/types.yaml - 可选类型定义

enums:
  - name: ElementType
    values:
      None: 0
      Fire: 1
      Water: 2
      Wind: 3
      Earth: 4

custom_types:
  - name: DateTime
    storage: string
    csharp: System.DateTime
    parse: System.DateTime.Parse({0}, System.Globalization.CultureInfo.InvariantCulture)
    import:
      - System

structs:
  - name: RewardItem
    generate_code: true
    fields:
      - name: ItemId
        type: int
        ref: Item.Id
      - name: Count
        type: int
      - name: Rate
        type: float
