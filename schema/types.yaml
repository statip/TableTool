# schema/types.yaml — 可选类型定义
# Excel 自己就是 schema，这个文件只在需要以下功能时才用：
#   枚举、自定义类型、独立结构体

# ─── 枚举 ──────────────────────────────────────────────
enums:
  - name: ElementType
    values:
      None: 0
      Fire: 1
      Water: 2
      Wind: 3
      Earth: 4

# ─── 自定义类型 ─────────────────────────────────────────
# Excel 存成 storage 类型，C# 转成 csharp 类型
custom_types:
  - name: DateTime
    storage: string
    csharp: System.DateTime
    parse: System.DateTime.Parse({0}, System.Globalization.CultureInfo.InvariantCulture)
    import: [System]

# ─── 独立结构体 ─────────────────────────────────────────
# 可以在多张表的字段里引用
structs:
  - name: RewardItem
    generate_code: true
    fields:
      - name: ItemId;  type: int;  ref: Item.Id
      - name: Count;   type: int
      - name: Rate;    type: float
